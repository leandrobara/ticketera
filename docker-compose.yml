services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0

    ports:
      - "3307:3306"

    environment:
      MYSQL_DATABASE: tickets
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine

    ports:
      - "6381:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data: