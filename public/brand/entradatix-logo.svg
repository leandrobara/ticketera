<svg xmlns="http://www.w3.org/2000/svg" width="360" height="104" viewBox="0 0 360 104" role="img" aria-labelledby="title">
  <title id="title">Entradatix</title>
  <defs>
    <linearGradient id="badgeGradient" x1="24" y1="14" x2="336" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171923"/>
      <stop offset="1" stop-color="#101118"/>
    </linearGradient>
    <linearGradient id="ticketGradient" x1="244" y1="33" x2="322" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset="0.54" stop-color="#e51bd2"/>
      <stop offset="1" stop-color="#842cff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="24" y="14" width="312" height="76" rx="20" fill="url(#badgeGradient)" filter="url(#softShadow)"/>
  <rect x="24.5" y="14.5" width="311" height="75" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="48" y="65" fill="#ffffff" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-1.4">Entrada</text>
  <rect x="243" y="33" width="76" height="38" rx="10" fill="url(#ticketGradient)"/>
  <text x="256" y="62" fill="#ffffff" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.5">tix</text>
</svg>
